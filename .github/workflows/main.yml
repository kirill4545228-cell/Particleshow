name: Build mod from zip

# Кладёшь в репозиторий ZIP с проектом (в корень) и этот файл как .github/workflows/build.yml.
# Action сам распакует каждый *.zip из корня, найдёт в нём проект (build.gradle / build.gradle.kts / pom.xml),
# соберёт и выложит готовые .jar в Artifacts.

on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  # 17 - для Minecraft 1.20.1. Для проектов под 1.20.5+ / 1.21 поставь '21'.
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.5'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Unpack every zip in repo root and build it
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "::error::В корне репозитория нет ни одного .zip"
            exit 1
          fi
          mkdir -p _jars
          for z in "${zips[@]}"; do
            echo "=== $z ==="
            dir="_src/${z%.zip}"
            rm -rf "$dir"
            mkdir -p "$dir"
            unzip -q -o "$z" -d "$dir"
            marker=$(find "$dir" -maxdepth 3 \( -name build.gradle -o -name build.gradle.kts -o -name pom.xml \) -print -quit)
            if [ -z "$marker" ]; then
              echo "::error::В $z не найден build.gradle / build.gradle.kts / pom.xml"
              exit 1
            fi
            proj=$(dirname "$marker")
            echo "Проект: $proj"
            (
              cd "$proj"
              if [ -f pom.xml ]; then
                mvn -B -q package -DskipTests
              elif [ -f gradlew ]; then
                chmod +x gradlew
                ./gradlew build --no-daemon
              else
                gradle build --no-daemon
              fi
            )
            find "$proj" \( -path '*/build/libs/*.jar' -o -path '*/target/*.jar' \) \
              ! -name '*-sources*' ! -name '*-dev*' ! -name '*-javadoc*' ! -name 'original-*' \
              -exec cp -v {} _jars/ \;
          done
          ls -la _jars

      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: _jars/*.jar
          if-no-files-found: error
